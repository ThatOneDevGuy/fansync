[package]
name = "fansync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keeps directory trees mirrored: an rsync-style pass, then fanotify-driven sync of each change"
repository = "https://github.com/ThatOneDevGuy/fansync"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.5"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
